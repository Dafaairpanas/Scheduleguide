<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4f46e5" />
      <stop offset="50%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>
    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#pwaGrad)" filter="url(#pwaShadow)" />

  <!-- Outer Circle Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="24" />

  <!-- Segment 1: Emerald (03:00 - 08:00) -->
  <path d="M 256 76 A 180 180 0 0 1 426 316" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" />

  <!-- Segment 2: Amber (08:00 - 14:00) -->
  <path d="M 426 316 A 180 180 0 0 1 128 382" fill="none" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" />

  <!-- Segment 3: Rose (14:00 - 19:00) -->
  <path d="M 128 382 A 180 180 0 0 1 86 198" fill="none" stroke="#f43f5e" stroke-width="24" stroke-linecap="round" />

  <!-- Center White Dial Core -->
  <circle cx="256" cy="256" r="100" fill="#ffffff" />

  <!-- Center Clock Indicator -->
  <circle cx="256" cy="256" r="14" fill="#4f46e5" />

  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="186" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="256" x2="316" y2="256" stroke="#ea580c" stroke-width="8" stroke-linecap="round" />

  <!-- Tick Accent -->
  <circle cx="256" cy="116" r="6" fill="#ffffff" />
  <circle cx="396" cy="256" r="6" fill="#ffffff" />
  <circle cx="256" cy="396" r="6" fill="#ffffff" />
  <circle cx="116" cy="256" r="6" fill="#ffffff" />
</svg>
